<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-label="A browser connects to Nginx on port 443; Nginx forwards requests to two backend app servers on ports 3000 and 3001.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:14px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-purple{fill:#E6DEFB;stroke:#7A5AF0;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
  </style>
  <defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="269" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
  <rect class="b-gray" x="40" y="105" width="120" height="56" rx="8"/>
  <text class="t-title" x="100" y="131" text-anchor="middle">Browser</text>
  <text class="t-sub" x="100" y="149" text-anchor="middle">yoursite.com</text>
  <rect class="b-teal" x="265" y="95" width="160" height="76" rx="8"/>
  <text class="t-title" x="345" y="122" text-anchor="middle">Nginx</text>
  <text class="t-sub" x="345" y="140" text-anchor="middle">reverse proxy</text>
  <text class="t-sub" x="345" y="157" text-anchor="middle">listens on :443</text>
  <rect class="b-purple" x="530" y="58" width="110" height="56" rx="8"/>
  <text class="t-title" x="585" y="83" text-anchor="middle">App copy 1</text>
  <text class="t-sub" x="585" y="101" text-anchor="middle">localhost:3000</text>
  <rect class="b-purple" x="530" y="152" width="110" height="56" rx="8"/>
  <text class="t-title" x="585" y="177" text-anchor="middle">App copy 2</text>
  <text class="t-sub" x="585" y="195" text-anchor="middle">localhost:3001</text>
  <text class="t-sub" x="212" y="124" text-anchor="middle">HTTPS</text>
  <line class="arr" x1="160" y1="133" x2="263" y2="133" marker-end="url(#a1)"/>
  <line class="arr" x1="425" y1="120" x2="528" y2="92" marker-end="url(#a1)"/>
  <line class="arr" x1="425" y1="146" x2="528" y2="178" marker-end="url(#a1)"/>
</svg>
