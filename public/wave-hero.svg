<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 389 267" style="--color-cobalt-300:#B9C7FE;--color-cobalt-400:#7585FB;--color-cobalt-600:#1E37F0;">
  <defs>
    <pattern id="grid" x=".5" y=".5" width="10" height="10" patternUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <line x1="0" y1="0" x2="10" y2="0" stroke="var(--color-cobalt-400)" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="10" stroke="var(--color-cobalt-400)" stroke-width="1"/>
    </pattern>
    <pattern id="gridw" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <line x1="0" y1="0" x2="10" y2="0" stroke="white" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="10" stroke="white" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="389" height="267" fill="url(#grid)" fill-opacity="0.4"/>

  <!-- Pixel staircase approximation (filled cobalt-300) -->
  <g fill="var(--color-cobalt-300)" stroke="var(--color-cobalt-400)" stroke-width="1">
    <animate attributeName="fill-opacity" dur="20s" values="0;1;1;0" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" dur="20s" values="0;1;1;0" repeatCount="indefinite"/>
    <rect x="30" y="110" width="20" height="20"/>
    <rect x="50" y="80"  width="20" height="20"/>
    <rect x="70" y="80"  width="20" height="20"/>
    <rect x="90" y="110" width="20" height="20"/>
    <rect x="110" y="150" width="20" height="20"/>
    <rect x="130" y="180" width="20" height="20"/>
    <rect x="150" y="180" width="20" height="20"/>
    <rect x="170" y="150" width="20" height="20"/>
    <rect x="190" y="110" width="20" height="20"/>
    <rect x="210" y="80"  width="20" height="20"/>
    <rect x="230" y="80"  width="20" height="20"/>
    <rect x="250" y="110" width="20" height="20"/>
    <rect x="270" y="150" width="20" height="20"/>
    <rect x="290" y="180" width="20" height="20"/>
    <rect x="310" y="180" width="20" height="20"/>
    <rect x="330" y="150" width="20" height="20"/>
  </g>

  <!-- White grid texture overlay on the pixel blocks (matches Aa) -->
  <g fill="url(#gridw)" fill-opacity="0.5">
    <rect x="30" y="110" width="20" height="20"/>
    <rect x="50" y="80"  width="20" height="20"/>
    <rect x="70" y="80"  width="20" height="20"/>
    <rect x="90" y="110" width="20" height="20"/>
    <rect x="110" y="150" width="20" height="20"/>
    <rect x="130" y="180" width="20" height="20"/>
    <rect x="150" y="180" width="20" height="20"/>
    <rect x="170" y="150" width="20" height="20"/>
    <rect x="190" y="110" width="20" height="20"/>
    <rect x="210" y="80"  width="20" height="20"/>
    <rect x="230" y="80"  width="20" height="20"/>
    <rect x="250" y="110" width="20" height="20"/>
    <rect x="270" y="150" width="20" height="20"/>
    <rect x="290" y="180" width="20" height="20"/>
    <rect x="310" y="180" width="20" height="20"/>
    <rect x="330" y="150" width="20" height="20"/>
  </g>

  <!-- Faint static outline of the smooth curve (always visible, low opacity) -->
  <path
    d="M 30 130 Q 70 50 110 130 Q 150 210 190 130 Q 230 50 270 130 Q 310 210 350 130"
    stroke="var(--color-cobalt-600)" stroke-width="2" stroke-opacity="0.25" fill="none"/>

  <!-- Animated smooth curve (draws in / out) -->
  <path
    d="M 30 130 Q 70 50 110 130 Q 150 210 190 130 Q 230 50 270 130 Q 310 210 350 130"
    stroke="var(--color-cobalt-600)" stroke-width="2" fill="none">
    <animate attributeName="stroke-dasharray" dur="20s" values="600,1000;0,1000;0,1000;600,1000" repeatCount="indefinite"/>
    <animate attributeName="opacity" dur="20s" values="1;0;0;1" repeatCount="indefinite"/>
  </path>

  <!-- Bezier handle lines (dashed, connecting anchors to control points) -->
  <g stroke="var(--color-cobalt-600)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.6">
    <animate attributeName="opacity" dur="20s" values="1;0;0;1" repeatCount="indefinite"/>
    <line x1="30"  y1="130" x2="70"  y2="50"/>
    <line x1="70"  y1="50"  x2="110" y2="130"/>
    <line x1="110" y1="130" x2="150" y2="210"/>
    <line x1="150" y1="210" x2="190" y2="130"/>
    <line x1="190" y1="130" x2="230" y2="50"/>
    <line x1="230" y1="50"  x2="270" y2="130"/>
    <line x1="270" y1="130" x2="310" y2="210"/>
    <line x1="310" y1="210" x2="350" y2="130"/>
  </g>

  <!-- Anchor points (filled circles, on baseline) -->
  <g fill="#F8F8F8" stroke="var(--color-cobalt-600)" stroke-width="1">
    <animate attributeName="opacity" dur="20s" values="1;0;0;1" repeatCount="indefinite"/>
    <circle cx="30"  cy="130" r="3.2"/>
    <circle cx="110" cy="130" r="3.2"/>
    <circle cx="190" cy="130" r="3.2"/>
    <circle cx="270" cy="130" r="3.2"/>
    <circle cx="350" cy="130" r="3.2"/>
  </g>

  <!-- Control points (filled circles, at peaks/troughs) -->
  <g fill="var(--color-cobalt-600)" stroke="var(--color-cobalt-600)" stroke-width="1">
    <animate attributeName="opacity" dur="20s" values="1;0;0;1" repeatCount="indefinite"/>
    <circle cx="70"  cy="50"  r="3.2"/>
    <circle cx="150" cy="210" r="3.2"/>
    <circle cx="230" cy="50"  r="3.2"/>
    <circle cx="310" cy="210" r="3.2"/>
  </g>

  <!-- Centerline (very faint, always) -->
  <line x1="30" y1="130" x2="350" y2="130" stroke="var(--color-cobalt-600)" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="2 4"/>
</svg>
