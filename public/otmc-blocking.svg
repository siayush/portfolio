<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Two timelines for the same wait. Blocking: the thread is frozen and idle the whole window. Non-blocking: the same thread serves other connections during the window, then processes the data at the same moment.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:14px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-purple{fill:#E6DEFB;stroke:#7A5AF0;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
    .dashv{stroke:#5A6270;stroke-width:1;stroke-dasharray:4 4;}
  </style>
  <defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="359" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
  <line class="dashv" x1="510" y1="55" x2="510" y2="290"/>
  <text class="t-sub" x="510" y="46" text-anchor="middle">data arrives</text>
  <text class="t-title" x="45" y="116" text-anchor="start">Blocking</text>
  <text class="t-sub" x="45" y="134" text-anchor="start">one thread</text>
  <rect class="b-gray" x="180" y="92" width="330" height="44" rx="6"/>
  <text class="t-sub" x="345" y="118" text-anchor="middle">thread frozen &#8212; does nothing else</text>
  <text class="t-sub" x="180" y="158" text-anchor="start">read() blocks here</text>
  <rect class="b-teal" x="514" y="92" width="72" height="44" rx="6"/>
  <text class="t-title" x="550" y="118" text-anchor="middle">process</text>
  <text class="t-title" x="45" y="248" text-anchor="start">Non-blocking</text>
  <text class="t-sub" x="45" y="266" text-anchor="start">same thread</text>
  <rect class="b-purple" x="180" y="224" width="74" height="44" rx="6"/><text class="t-sub" x="217" y="250" text-anchor="middle">serve B</text>
  <rect class="b-purple" x="262" y="224" width="74" height="44" rx="6"/><text class="t-sub" x="299" y="250" text-anchor="middle">serve C</text>
  <rect class="b-purple" x="344" y="224" width="74" height="44" rx="6"/><text class="t-sub" x="381" y="250" text-anchor="middle">serve D</text>
  <rect class="b-purple" x="426" y="224" width="80" height="44" rx="6"/><text class="t-sub" x="466" y="250" text-anchor="middle">serve E</text>
  <text class="t-sub" x="180" y="290" text-anchor="start">read() returns EAGAIN instantly &#8212; moves on</text>
  <rect class="b-teal" x="514" y="224" width="72" height="44" rx="6"/>
  <text class="t-title" x="550" y="250" text-anchor="middle">process</text>
  <line class="arr" x1="180" y1="320" x2="610" y2="320" marker-end="url(#a5)"/>
  <text class="t-sub" x="180" y="338" text-anchor="start">time</text>
</svg>
