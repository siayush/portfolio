<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-label="Nginx sits between the internet and three Node worker processes, one per CPU core, handling TLS, static files and buffering so each Node worker only receives clean, fast application requests.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:14px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-purple{fill:#E6DEFB;stroke:#7A5AF0;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
  </style>
  <defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="259" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
  <rect class="b-gray" x="40" y="100" width="130" height="70" rx="8"/>
  <text class="t-title" x="105" y="129" text-anchor="middle">Internet</text>
  <text class="t-sub" x="105" y="149" text-anchor="middle">raw + hostile</text>
  <rect class="b-teal" x="255" y="80" width="170" height="100" rx="8"/>
  <text class="t-title" x="340" y="106" text-anchor="middle">Nginx</text>
  <text class="t-sub" x="340" y="128" text-anchor="middle">TLS termination</text>
  <text class="t-sub" x="340" y="146" text-anchor="middle">static + buffering</text>
  <text class="t-sub" x="340" y="164" text-anchor="middle">load balancer</text>
  <rect class="b-purple" x="520" y="48" width="120" height="46" rx="7"/>
  <text class="t-title" x="580" y="68" text-anchor="middle">Node &#183; core 1</text>
  <text class="t-sub" x="580" y="84" text-anchor="middle">1 thread</text>
  <rect class="b-purple" x="520" y="112" width="120" height="46" rx="7"/>
  <text class="t-title" x="580" y="132" text-anchor="middle">Node &#183; core 2</text>
  <text class="t-sub" x="580" y="148" text-anchor="middle">1 thread</text>
  <rect class="b-purple" x="520" y="176" width="120" height="46" rx="7"/>
  <text class="t-title" x="580" y="196" text-anchor="middle">Node &#183; core 3</text>
  <text class="t-sub" x="580" y="212" text-anchor="middle">1 thread</text>
  <line class="arr" x1="170" y1="135" x2="253" y2="130" marker-end="url(#a6)"/>
  <line class="arr" x1="425" y1="116" x2="518" y2="74" marker-end="url(#a6)"/>
  <line class="arr" x1="425" y1="132" x2="518" y2="135" marker-end="url(#a6)"/>
  <line class="arr" x1="425" y1="150" x2="518" y2="196" marker-end="url(#a6)"/>
</svg>
