<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 446" role="img" aria-label="The network stack as six descending layers, from the reverse proxy at the top down to the epoll system call at the bedrock.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:15px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .badge{fill:#16191F;}
    .badge-t{fill:#ffffff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
    .eyebrow{fill:#2D6BFF;font-size:11.5px;font-weight:600;letter-spacing:.18em;}
    .b-blue{fill:#DCE7FF;stroke:#2D6BFF;stroke-width:1.5;}
    .b-amber{fill:#FBE6C2;stroke:#E8920C;stroke-width:1.5;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-purple{fill:#E6DEFB;stroke:#7A5AF0;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
  </style>
  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="445" rx="16" fill="#ffffff" stroke="#DDE1E8"/>

  <text class="eyebrow" x="40" y="40">ONE THREAD &#183; A MILLION CONNECTIONS</text>

  <!-- descent arrow -->
  <line class="arr" x1="52" y1="70" x2="52" y2="404" marker-end="url(#h1)"/>
  <text class="t-sub" x="40" y="240" transform="rotate(-90 40 240)" text-anchor="middle">descend, layer by layer</text>

  <!-- bars -->
  <g>
    <rect class="badge" x="80" y="70" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="99" text-anchor="middle">01</text>
    <rect class="b-teal" x="132" y="70" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="91">The reverse proxy</text>
    <text class="t-sub" x="150" y="108">Nginx at the front door &#8212; one public entry point</text>
  </g>
  <g>
    <rect class="badge" x="80" y="126" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="155" text-anchor="middle">02</text>
    <rect class="b-blue" x="132" y="126" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="147">The event loop</text>
    <text class="t-sub" x="150" y="164">one thread, non-blocking, never frozen</text>
  </g>
  <g>
    <rect class="badge" x="80" y="182" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="211" text-anchor="middle">03</text>
    <rect class="b-purple" x="132" y="182" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="203">Node.js &amp; libuv</text>
    <text class="t-sub" x="150" y="220">the same loop for your code, plus a thread pool</text>
  </g>
  <g>
    <rect class="badge" x="80" y="238" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="267" text-anchor="middle">04</text>
    <rect class="b-gray" x="132" y="238" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="259">Why a proxy at all?</text>
    <text class="t-sub" x="150" y="276">keeping the one precious thread clean</text>
  </g>
  <g>
    <rect class="badge" x="80" y="294" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="323" text-anchor="middle">05</text>
    <rect class="b-amber" x="132" y="294" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="315">I/O, blocking vs non-blocking</text>
    <text class="t-sub" x="150" y="332">what the thread does while it waits</text>
  </g>
  <g>
    <rect class="badge" x="80" y="350" width="44" height="46" rx="8"/>
    <text class="badge-t" x="102" y="379" text-anchor="middle">06</text>
    <rect class="b-blue" x="132" y="350" width="500" height="46" rx="8"/>
    <text class="t-title" x="150" y="371">epoll, the bedrock</text>
    <text class="t-sub" x="150" y="388">one system call the whole stack rests on</text>
  </g>
</svg>
