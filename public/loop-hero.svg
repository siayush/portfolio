        M 195 60 C 234.2 60 270 92.8 270 132 C 270 171.2 234.2 204 195 204 C 155.8 204 120 171.2 120 132 C 120 92.8 155.8 60 195 60 Z;
        M 195 60 C 234.2 60 270 92.8 270 132 C 270 171.2 234.2 204 195 204 C 155.8 204 120 171.2 120 132 C 120 92.8 155.8 60 195 60 Z;
        M 165 75 C 280 30 245 165 175 110 C 95 45 130 215 220 175 C 305 140 235 70 160 135 C 95 195 250 220 165 75 Z
      "/>
