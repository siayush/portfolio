<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 390 270" style="--color-cobalt-300:#B9C7FE;--color-cobalt-400:#7585FB;--color-cobalt-600:#1E37F0;">
  <defs>
    <pattern id="grid" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <line x1="0" y1="0" x2="10" y2="0" stroke="var(--color-cobalt-400)" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="10" stroke="var(--color-cobalt-400)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="390" height="270" fill="url(#grid)" fill-opacity="0.35"/>
  <!-- Close the missing left + bottom edges of the grid -->
  <line x1="0.5" y1="0" x2="0.5" y2="270" stroke="var(--color-cobalt-400)" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="0" y1="269.5" x2="390" y2="269.5" stroke="var(--color-cobalt-400)" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Morphing path: tangle → less-tangle → almost-circle → circle → loop back -->
