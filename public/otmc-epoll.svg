<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="A user-space loop registers sockets via epoll_ctl into the interest list (a red-black tree). When data arrives, a kernel callback appends the fd to the ready list. epoll_wait returns only the ready fds.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:14px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .b-blue{fill:#DCE7FF;stroke:#2D6BFF;stroke-width:1.5;}
    .b-amber{fill:#FBE6C2;stroke:#E8920C;stroke-width:1.5;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
    .dash{stroke:#C7CCD6;stroke-width:1;stroke-dasharray:4 4;fill:none;}
  </style>
  <defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="419" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
  <rect class="b-teal" x="40" y="140" width="130" height="120" rx="8"/>
  <text class="t-title" x="105" y="194" text-anchor="middle">Event loop</text>
  <text class="t-sub" x="105" y="214" text-anchor="middle">user space</text>
  <rect class="dash" x="230" y="60" width="410" height="320" rx="14" fill="none"/>
  <text class="t-title" x="252" y="86" text-anchor="start">Kernel &#8212; epoll instance</text>
  <rect class="b-blue" x="262" y="118" width="170" height="94" rx="8"/>
  <text class="t-title" x="347" y="147" text-anchor="middle">Interest list</text>
  <text class="t-sub" x="347" y="169" text-anchor="middle">red-black tree</text>
  <text class="t-sub" x="347" y="189" text-anchor="middle">every watched fd</text>
  <rect class="b-amber" x="460" y="118" width="150" height="94" rx="8"/>
  <text class="t-title" x="535" y="154" text-anchor="middle">Ready list</text>
  <text class="t-sub" x="535" y="176" text-anchor="middle">fds ready now</text>
  <rect class="b-gray" x="480" y="300" width="150" height="55" rx="8"/>
  <text class="t-title" x="555" y="324" text-anchor="middle">Incoming data</text>
  <text class="t-sub" x="555" y="344" text-anchor="middle">network card</text>
  <text class="t-sub" x="210" y="151" text-anchor="middle">1. epoll_ctl</text>
  <line class="arr" x1="170" y1="162" x2="260" y2="158" marker-end="url(#a4)"/>
  <text class="t-sub" x="600" y="258" text-anchor="middle">2. callback</text>
  <line class="arr" x1="552" y1="298" x2="538" y2="214" marker-end="url(#a4)"/>
  <text class="t-sub" x="330" y="288" text-anchor="middle">3. epoll_wait returns ready fds</text>
  <path class="arr" d="M475 212 V 268 H 172" fill="none" marker-end="url(#a4)"/>
</svg>
