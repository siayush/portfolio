<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="A single JS event loop sits on libuv, which splits work into network I/O via epoll/kqueue and a thread pool for file, DNS and crypto work.">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .t-title{fill:#16191F;font-weight:600;font-size:14px;}
    .t-sub{fill:#5A6270;font-size:11.5px;}
    .b-blue{fill:#DCE7FF;stroke:#2D6BFF;stroke-width:1.5;}
    .b-teal{fill:#CDEDE6;stroke:#0E8C7A;stroke-width:1.5;}
    .b-purple{fill:#E6DEFB;stroke:#7A5AF0;stroke-width:1.5;}
    .b-gray{fill:#EAECF1;stroke:#C7CCD6;stroke-width:1.5;}
    .arr{stroke:#16191F;stroke-width:1.6;fill:none;}
    .dash{stroke:#C7CCD6;stroke-width:1;stroke-dasharray:4 4;fill:none;}
  </style>
  <defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="439" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
  <rect class="b-teal" x="235" y="40" width="210" height="60" rx="8"/>
  <text class="t-title" x="340" y="66" text-anchor="middle">JavaScript event loop</text>
  <text class="t-sub" x="340" y="86" text-anchor="middle">single thread, your code</text>
  <line class="arr" x1="340" y1="100" x2="340" y2="148" marker-end="url(#a3)"/>
  <rect class="dash" x="60" y="150" width="560" height="250" rx="14" fill="none"/>
  <text class="t-title" x="82" y="176" text-anchor="start">libuv (C library)</text>
  <line class="arr" x1="320" y1="178" x2="210" y2="203" marker-end="url(#a3)"/>
  <line class="arr" x1="360" y1="178" x2="470" y2="203" marker-end="url(#a3)"/>
  <rect class="b-blue" x="100" y="205" width="210" height="60" rx="8"/>
  <text class="t-title" x="205" y="231" text-anchor="middle">Network I/O</text>
  <text class="t-sub" x="205" y="251" text-anchor="middle">sockets, HTTP requests</text>
  <rect class="b-purple" x="370" y="205" width="210" height="60" rx="8"/>
  <text class="t-title" x="475" y="231" text-anchor="middle">Thread pool</text>
  <text class="t-sub" x="475" y="251" text-anchor="middle">4 threads by default</text>
  <line class="arr" x1="205" y1="265" x2="205" y2="313" marker-end="url(#a3)"/>
  <line class="arr" x1="475" y1="265" x2="475" y2="313" marker-end="url(#a3)"/>
  <rect class="b-gray" x="100" y="315" width="210" height="60" rx="8"/>
  <text class="t-title" x="205" y="341" text-anchor="middle">epoll / kqueue</text>
  <text class="t-sub" x="205" y="361" text-anchor="middle">non-blocking, like Nginx</text>
  <rect class="b-gray" x="370" y="315" width="210" height="60" rx="8"/>
  <text class="t-title" x="475" y="341" text-anchor="middle">file &#183; DNS &#183; crypto</text>
  <text class="t-sub" x="475" y="361" text-anchor="middle">no non-blocking API</text>
</svg>
