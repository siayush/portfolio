<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>OSI seven layers mapped onto the four TCP/IP layers</title>
<desc>On the left, the seven OSI layers stacked from Application down to Physical. On the right, the four TCP/IP layers. Connecting lines and matching colors show that OSI layers 7, 6 and 5 collapse into the TCP/IP Application layer, OSI layer 4 maps to Transport, OSI layer 3 maps to Internet, and OSI layers 2 and 1 collapse into the Link layer.</desc>
<rect x="0.5" y="0.5" width="679" height="469" rx="14" fill="#ffffff" stroke="#DDE1E8"/>
<g style="font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;">

  <text x="160" y="46" text-anchor="middle" style="fill:rgb(68, 68, 65);font-size:13px;font-weight:600;">OSI · 7 layers</text>
  <text x="520" y="46" text-anchor="middle" style="fill:rgb(68, 68, 65);font-size:13px;font-weight:600;">TCP/IP · 4 layers</text>

  <!-- connectors (behind boxes) -->
  <line x1="280" y1="92"  x2="400" y2="144" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="144" x2="400" y2="144" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="196" x2="400" y2="144" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="248" x2="400" y2="248" stroke="rgb(15, 110, 86)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="300" x2="400" y2="300" stroke="rgb(24, 95, 165)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="352" x2="400" y2="378" stroke="rgb(95, 94, 90)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="280" y1="408" x2="400" y2="378" stroke="rgb(95, 94, 90)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- LEFT: OSI 7 layers -->
  <rect x="40" y="70"  width="240" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="160" y="97"  text-anchor="middle" style="fill:rgb(60, 52, 137);font-size:13px;font-weight:500;">7 · Application</text>
  <rect x="40" y="122" width="240" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="160" y="149" text-anchor="middle" style="fill:rgb(60, 52, 137);font-size:13px;font-weight:500;">6 · Presentation</text>
  <rect x="40" y="174" width="240" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="160" y="201" text-anchor="middle" style="fill:rgb(60, 52, 137);font-size:13px;font-weight:500;">5 · Session</text>
  <rect x="40" y="226" width="240" height="44" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="1"/>
  <text x="160" y="253" text-anchor="middle" style="fill:rgb(8, 80, 65);font-size:13px;font-weight:500;">4 · Transport</text>
  <rect x="40" y="278" width="240" height="44" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="1"/>
  <text x="160" y="305" text-anchor="middle" style="fill:rgb(12, 68, 124);font-size:13px;font-weight:500;">3 · Network</text>
  <rect x="40" y="330" width="240" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="1"/>
  <text x="160" y="357" text-anchor="middle" style="fill:rgb(68, 68, 65);font-size:13px;font-weight:500;">2 · Data Link</text>
  <rect x="40" y="382" width="240" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="1"/>
  <text x="160" y="409" text-anchor="middle" style="fill:rgb(68, 68, 65);font-size:13px;font-weight:500;">1 · Physical</text>

  <!-- RIGHT: TCP/IP 4 layers -->
  <rect x="400" y="70"  width="240" height="148" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="520" y="138" text-anchor="middle" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:600;">Application</text>
  <text x="520" y="158" text-anchor="middle" style="fill:rgb(83, 74, 183);font-size:11.5px;">HTTP, TLS, DNS, SMTP</text>

  <rect x="400" y="226" width="240" height="44" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="1"/>
  <text x="520" y="244" text-anchor="middle" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:600;">Transport</text>
  <text x="520" y="261" text-anchor="middle" style="fill:rgb(15, 110, 86);font-size:11.5px;">TCP, UDP</text>

  <rect x="400" y="278" width="240" height="44" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="1"/>
  <text x="520" y="296" text-anchor="middle" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:600;">Internet</text>
  <text x="520" y="313" text-anchor="middle" style="fill:rgb(24, 95, 165);font-size:11.5px;">IP, ICMP, ARP</text>

  <rect x="400" y="330" width="240" height="96" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="1"/>
  <text x="520" y="372" text-anchor="middle" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:600;">Link</text>
  <text x="520" y="390" text-anchor="middle" style="fill:rgb(95, 94, 90);font-size:11.5px;">Ethernet, WiFi</text>
</g>
</svg>
