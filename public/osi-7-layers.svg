<svg width="100%" viewBox="0 0 680 548" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The seven OSI layers grouped by their four TCP/IP roles</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A vertical stack of the seven OSI layers from Application at the top to Physical at the bottom. Layers 5 to 7 are colored as the Application group, layer 4 as Transport, layer 3 as Internet, and layers 1 to 2 as Link, matching the four-layer TCP/IP model. When sending, data flows from top to bottom.</desc>
<rect x="0.5" y="0.5" width="679" height="547" rx="14" fill="#ffffff" stroke="#DDE1E8"/>

